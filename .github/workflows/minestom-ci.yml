name: Publish Minestom support
on:
  push:
    branches:
      - 'feat/minestom'

concurrency: "gradle-snapshot-${{ github.ref }}"

permissions:
  contents: read

jobs:
  publish:
    name: "Publish"
    runs-on: "ubuntu-latest"
    environment:
      name: "snapshot"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: "Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          gradle-version: "wrapper"

      - name: "Validate version"
        run: |
          VERSION="$(./gradlew properties | awk '/^version:/ { print $2; }')"
          if ! echo "$VERSION" | grep -q 'SNAPSHOT'; then
            echo "Release version detected, refusing to publish..."
            exit 1
          fi
          echo "Snapshot version detected"

      - name: "Publish artifacts"
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_hyperaSnapshotsUsername: "${{ secrets.HYPERA_SNAPSHOTS_USERNAME }}"
          ORG_GRADLE_PROJECT_hyperaSnapshotsPassword: "${{ secrets.HYPERA_SNAPSHOTS_PASSWORD }}"

  dependency-graph:
    name: "Dependency Graph"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true

      - name: "Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: "Generate and submit dependency graph"
        uses: gradle/actions/dependency-submission@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
